<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trip map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Google Maps side-panel look: Google Sans, #1f1f1f text, #e8eaed dividers, 8px chips, MD3 elevation. */
      :root {
        --ink: #1f1f1f;
        --muted: #5e5e5e;
        --line: #e8eaed;
        --hover: #f1f3f4;
        --blue: #0b57d0;
        --sans: "Google Sans", Roboto, Arial, sans-serif;
        --text: "Google Sans Text", Roboto, Arial, sans-serif;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: clip;
        overscroll-behavior: none;
        font: 14px/20px var(--text);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
      }
      button {
        font: inherit;
        color: inherit;
      }
      aside {
        width: 408px;
        max-width: 40vw;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: #fff;
        position: relative;
        z-index: 1;
        box-shadow:
          0 1px 2px rgba(60, 64, 67, 0.3),
          0 2px 6px 2px rgba(60, 64, 67, 0.15);
      }
      #map-panel {
        flex: 1;
        min-width: 0;
        position: relative;
      }
      #map {
        position: absolute;
        inset: 0;
      }

      /* Left: trip timeline */
      #place {
        width: 33.333vw;
        max-width: none;
      }
      #timeline {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        padding-bottom: 24px;
      }
      .day-head {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 6px 10px;
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-top: 1px solid var(--line);
        background: #fff;
        text-align: left;
        cursor: pointer;
      }
      .day:first-child .day-head {
        border-top: 0;
      }
      .day-head:hover {
        background: #f8fafd;
      }
      .day-when {
        flex-shrink: 0;
        max-width: 100%;
        font: 500 16px/24px var(--sans);
      }
      .day-locations {
        display: flex;
        align-items: center;
        gap: 4px;
        max-width: 100%;
        margin-left: auto;
        overflow-x: auto;
      }
      .day-location {
        display: inline-flex;
        align-items: center;
        flex: none;
        gap: 4px;
      }
      .day-route-arrow {
        color: var(--muted);
      }
      .day-where {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 7px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--c) 14%, white);
        color: color-mix(in srgb, var(--c) 60%, black);
        font-weight: 500;
        font-size: 13px;
        white-space: nowrap;
      }
      @media (max-width: 760px) {
        .day-head {
          padding-inline: 12px;
        }
      }
      .items {
        padding: 0 16px 8px;
      }
      .item {
        position: relative;
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 0 4px;
        padding: 8px 8px 8px 0;
        border-radius: 8px;
        cursor: pointer;
        outline: none;
        scroll-margin-top: 72px;
      }
      .item:hover {
        background: var(--hover);
      }
      .item.active {
        background: #e8f0fe;
      }
      .item:focus-visible {
        box-shadow: inset 0 0 0 2px var(--blue);
      }
      .icon {
        position: relative;
        justify-self: center;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        font-size: 22px;
        line-height: 1;
      }
      .body {
        min-width: 0;
      }
      .line1 {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .name {
        font-weight: 500;
      }
      .price {
        color: var(--muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .detail {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
        font-size: 13px;
        line-height: 18px;
      }
      .item.suggestion {
        margin: 6px 0;
      }
      .options {
        padding: 0 16px 12px;
      }
      .items:not(:empty) + .options:not(:empty) {
        padding-top: 18px;
      }
      .choice-heading {
        margin: 12px 0 6px 12px;
        color: #681da8;
        font: 500 14px/20px var(--sans);
      }
      .item.suggestion {
        grid-template-columns: 44px 1fr 36px;
      }
      .pick {
        align-self: start;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        margin-top: 2px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        fill: #0b57d0;
        cursor: pointer;
      }
      .pick:hover {
        background: #e8f0fe;
      }
      .pick.on {
        background: #0b57d0;
        fill: #fff;
      }
      .pick.on:hover {
        background: #0842a0;
      }
      .item.passed {
        opacity: 0.45;
      }
      .map-pin {
        position: relative;
        width: 26px;
        height: 31px;
        filter: drop-shadow(0 1px 1px #0005);
        transform-origin: center bottom;
      }
      .map-pin::before {
        content: "";
        position: absolute;
        left: 8px;
        bottom: 3px;
        width: 10px;
        height: 10px;
        background: white;
        border-radius: 2px;
        transform: rotate(45deg);
      }
      .map-pin-glyph {
        position: relative;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        width: 26px;
        height: 26px;
        border: 2px solid white;
        border-radius: 50%;
        background: var(--pin-fill);
        font-size: 14px;
        line-height: 1;
      }
      .map-pin.selected {
        scale: 1.24;
      }
      .plane {
        transform: translateY(50%);
      }
      .plane span {
        display: block;
        font-size: 22px;
        line-height: 1;
        filter: drop-shadow(0 1px 1px #0005);
      }
      .map-overview .map-pin,
      .map-overview .plane span {
        scale: 0.72;
        filter: drop-shadow(0 1px 1px #0003);
      }
      .map-overview .map-pin.selected {
        scale: 1;
      }
      /* Right: Google's place card, opened from a pin or timeline row */
      #place[hidden] {
        display: flex;
        position: fixed;
        inset: 0 0 0 auto;
        visibility: hidden;
        pointer-events: none;
      }
      #place-bar {
        position: absolute;
        top: 4px;
        right: 4px;
        z-index: 1;
      }
      #place-close {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        padding: 0;
        fill: #444746;
        cursor: pointer;
      }
      #place-close:hover {
        background: var(--hover);
      }
      #place-body {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        padding-top: 8px;
      }
      gmp-place-details {
        border: 0;
        border-radius: 0;
      }
      .place-card-ready:not(.place-card-inactive) {
        /* The Google widget renders its 50px header inside a closed shadow root. */
        --place-header-height: 50px;
        display: block;
        margin-top: calc(-1 * var(--place-header-height));
        clip-path: inset(var(--place-header-height) 0 0);
      }
      .place-card-inactive {
        position: fixed;
        inset: 0 0 auto auto;
        width: 33.333vw;
        visibility: hidden;
        pointer-events: none;
      }
      .authored {
        padding: 0 24px 24px;
        line-height: 1.5;
      }
      .authored h2 {
        margin: 0 0 8px;
        font: 400 22px/28px var(--sans);
      }
    </style>
  </head>
  <body>
    <aside id="trip" aria-label="Trip timeline">
      <div id="timeline"></div>
    </aside>
    <main id="map-panel">
      <div id="map"></div>
    </main>
    <aside id="place" hidden>
      <div id="place-bar">
        <button id="place-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path d="M6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5l5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6z" />
          </svg>
        </button>
      </div>
      <div id="place-body"></div>
    </aside>
    <script type="module" src="./map.ts"></script>
  </body>
</html>
